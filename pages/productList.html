<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tech Store - Product List</title>
	<link rel="stylesheet" href="/styles/productList.css">
</head>

<body style="margin-top: 70px;">
    <script src="/scripts/components/navigation.js"></script>
	<header class="page-header">
		<h1>Premium Tech Products</h1>
		<p>Discover latest laptops, phones, and computers with top value</p>
	</header>

	<main class="container">
		<aside class="sidebar">
			<div class="sidebar-header">
				<h3>Filters</h3>
				<button id="clearFiltersBtn" class="clear-btn" type="button">Clear all</button>
			</div>

			<div class="filter-section">
				<h4>Category</h4>
				<div id="categoryFilters" class="filter-group"></div>
			</div>

			<div class="filter-section">
				<h4>Price range</h4>
				<div id="priceFilters" class="filter-group"></div>
			</div>

			<div class="filter-section">
                <h4>Brand</h4>
                <div id="brandFilters" class="filter-group"></div>
                
            </div>
		</aside>

		<section class="products-section">
			<div class="products-header">
				<div>
					<h2>All Products</h2>
					<p id="resultsCount" class="results-count"></p>
				</div>

				<label class="sort-label" for="sortSelect">
					Sort by
					<select id="sortSelect">
						<option value="newest">Newest</option>
						<option value="price-low">Price: Low to High</option>
						<option value="price-high">Price: High to Low</option>
						<option value="name-az">Name: A-Z</option>
					</select>
            
				</label>
			</div>

			<div class="products-grid" id="productsGrid"></div>
		</section>
	</main>

    <script src="/scripts/components/footer.js"></script>

	<script src="/scripts/productList.js"></script>

</body>
</html>
