<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | TechHub</title>
    <link rel="stylesheet" href="/styles/navbar.css">
    <link rel="stylesheet" href="/styles/profile.css">
    <script src="/scripts/profile.js"></script>
</head>

<style>

</style>
<body>


    <div class="profile-container">
        <div class="profile-wrapper">
            <!-- Sidebar -->
            <aside class="sidebar">
                <img src="https://api.placeholder.com/120/120?text=User" alt="Profile" class="avatar">
                <h2 id="sidebar-name">Sarah Johnson</h2>
                <p id="email-temp"></p>
                <button class="btn-primary">Edit Profile</button>
              
            </aside>

            <!-- Main Content -->
            <main class="main-content">
                <!-- Profile Information -->
                <div>
                    <h3>Profile Information</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" value="Sarah Johnson" disabled id="input-fullname">
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" value="sarah@techmail.com" disabled id="input-email">
                        </div>
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="text" value="+1 (555) 123-4567" disabled id="input-phone"  >
                        </div>
                        <div class="form-group">
                            <label>Member Since</label>
                            <input type="text" value="January 15, 2024" disabled id="input-member">
                        </div>
                    </div>
                </div>

                <!-- Recent Orders -->
                <div>
                    <h3>Recent Orders</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Product</th>
                                <th>Date</th>
                                <th>Amount</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>#TH001245</td>
                                <td>Wireless Headphones Pro</td>
                                <td>Feb 10, 2025</td>
                                <td>$149.99</td>
                                <td><span class="status returned">Delivered</span></td>
                            </tr>
                            <tr>
                                <td>#TH001243</td>
                                <td>USB-C Hub 7-in-1</td>
                                <td>Feb 05, 2025</td>
                                <td>$79.99</td>
                                <td><span class="status returned">Delivered</span></td>
                            </tr>
                            <tr>
                                <td>#TH001240</td>
                                <td>4K Webcam Ultra</td>
                                <td>Jan 28, 2025</td>
                                <td>$199.99</td>
                                <td><span class="status borrowed">Shipped</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Wishlist -->
                
            </main>
        </div>
    </div>
</body>
</html>
