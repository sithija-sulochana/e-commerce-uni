<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Create Account</title>
    <link rel="stylesheet" href="../styles/registrationPage.css">
<script src="../scripts/registrationPage.js"></script>
<script src="../scripts/profile.js"></script>
</head>
<body>
    <div class="container" >
        <!-- Left Side - Image Banner -->
        <div class="banner" style="background-image: url('../assets/image-acc.png');background-size: cover; ">
            <div class="banner-content" >
               
                <h1 style="font-size: 50px;">Welcome to Tech <span style="padding: 5px; width: auto; background-color: rgb(110, 110, 234); border-radius: 15px; margin-top: 5px;">Hub</span> </h1>
                <p>Explore the latest tech products and services</p>
            </div>
        </div>

        <!-- Right Side - Registration Form -->
        <div class="form-section">
            <div class="form-wrapper">
                <div class="brand-logo">
                    
                    <div style="display: flex;justify-content: center; align-items: center; gap: 5px;">
                        <img src="../assets/brandsLogos/Screenshot 2026-03-16 130045.png" alt="" style="margin-left: 50%; margin-right: 20px;">
                    </div>
                    
                </div>
                <h2>Create Account</h2>
                <p class="subtitle">Enter your details to get started</p>

                <form id="registerForm"  method="POST" action="../backend/auth/register.php"  novalidate>
                    <!-- Full Name -->
                    <div class="form-group">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                        <span class="error-msg"></span>
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="your@email.com" required>
                        <span class="error-msg"></span>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="number" id="phone" name="phone" placeholder="Enter your phone number" autocomplete="off" required>
                        <span class="error-msg"></span>
                    </div>


                    <!-- Password -->
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Minimum 8 characters" required>
                        <span class="error-msg"></span>
                    </div>

                        <div class="form-group">
                        <label for="address">Address</label>
                        <input type="text" id="address" name="address" placeholder="Enter your address" required>
                        <span class="error-msg"></span>
                    </div>


                    <!-- Checkbox -->
                    <div class="form-group checkbox">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">I agree to the Terms & Conditions</label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="submit-btn">Create Account</button>
                </form>

                <!-- Login Link -->
                <p class="login-link">Already have an account? <a href="/E-commerce/pages/loginPage.html">Sign In</a></p>
            </div>
        </div>
    </div>
</body>
</html>
