<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ - TechHub | Frequently Asked Questions</title>
    
    <link rel="stylesheet" href="../styles/faq.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    
    <script defer>
        // Load FAQs dynamically
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                const response = await fetch('../backend/products/faq.php');
                const grouped = await response.json();
                const wrapper = document.querySelector('.faq-wrapper');
                wrapper.innerHTML = '';
                
                for (const [category, faqs] of Object.entries(grouped)) {
                    const section = document.createElement('section');
                    section.className = 'faq-section';
                    section.innerHTML = `<h2 class="section-title">${category}</h2>`;
                    
                    faqs.forEach(faq => {
                        const item = document.createElement('div');
                        item.className = 'faq-item';
                        item.innerHTML = `
                            <button class="faq-question">
                                <span>${faq.question}</span>
                                <span class="faq-icon">+</span>
                            </button>
                            <div class="faq-answer">
                                <p>${faq.answer}</p>
                            </div>
                        `;
                        section.appendChild(item);
                    });
                    
                    wrapper.appendChild(section);
                }
                
                // Re-attach event listeners after loading
                attachFaqListeners();
            } catch (error) {
                console.error('Error loading FAQs:', error);
            }
        });

        function attachFaqListeners() {
            const faqQuestions = document.querySelectorAll('.faq-question');
            faqQuestions.forEach(button => {
                button.addEventListener('click', function() {
                    const faqItem = this.parentElement;
                    faqItem.classList.toggle('active');
                    faqQuestions.forEach(otherButton => {
                        if (otherButton !== button) {
                            otherButton.parentElement.classList.remove('active');
                        }
                    });
                });
            });
        }
    </script>
    <script src="../scripts/faq.js" defer></script>
</head>

<body>
    <script src="../scripts/components/navigation.js"></script>

    <!-- FAQ HEADER -->
    <section class="faq-header">
        <div class="faq-header-content">
            <h1>Frequently Asked Questions</h1>
            <p>Find answers to common questions about our products, shipping, returns, and more</p>
        </div>
    </section>

    <!-- FAQ CONTAINER -->
    <main class="faq-container">
        <div class="faq-wrapper">
            <!-- FAQs will be loaded dynamically here -->
        </div>
    </main>

    <!-- CONTACT CTA -->
    <section class="faq-contact-cta">
        <div class="cta-content">
            <h2>Didn't find your answer?</h2>
            <p>Our customer support team is here to help</p>
            <a href="../pages/ContactPage.html" class="cta-btn">Contact Us</a>
        </div>
    </section>

    <script src="../scripts/components/footer.js"></script>
</body>

</html>
