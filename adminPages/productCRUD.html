<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Management</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #f4f6f9;
}



/* HEADER */
.header {
    background: #001f3f;
    color: white;
    padding: 15px 30px;
}

/* CONTAINER */
.container {
    padding: 30px;
}

/* FLEX GRID */
.grid {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
}

.card {
    flex: 1 1 400px;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.navbar {
    background: #001f3f;
    color: white;
    padding: 15px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.navbar h1 {
    margin: 0;
    font-size: 20px;
}

.nav-links a {
    color: white;
    margin-left: 20px;
    text-decoration: none;
    font-size: 14px;
}

.nav-links a:hover {
    text-decoration: underline;
}

/* INPUTS */
input, select {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    margin-top: 15px;
    padding: 10px;
    background: #001f3f;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    background: #003366;
}

/* KEY VALUE */
.kv-row {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}

.kv-row input {
    flex: 1;
}

.kv-row button {
    background: green;
}

.kv-row .remove {
    background: red;
}

/* TABLE */
table {
    width: 100%;
    margin-top: 20px;
    border-collapse: collapse;
    background: white;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
}

th {
    background: #001f3f;
    color: white;
}

img {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 5px;
}
</style>
</head>

<body>

    <div class="navbar">
    <div class="logo" onclick="window.location.href='#'" style="font-weight: 700; font-size: 30px;">Tech<span style="color:white; padding: 0 5px; background-color: #5b9bf0; margin-left: 5px;border-radius: 5px;">Hub</span> </div>
    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Users</a>
        <a href="#">Orders</a>
        <a href="#">FAQ</a>
    </div>
</div>

<div class="header" style="margin-top: 5px;">
    <h1><i class="fas fa-box"></i> Product Management</h1>
</div>

<div class="container">

<div class="grid">

<!-- ADD PRODUCT -->
<div class="card">
    <h2 style="display: inline-flex; gap: 4px; margin-bottom: 0; margin-top: 0; color: gray;">Add Product <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9ImN1cnJlbnRDb2xvciIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiIGNsYXNzPSJsdWNpZGUgbHVjaWRlLXBhY2thZ2UtcGx1cy1pY29uIGx1Y2lkZS1wYWNrYWdlLXBsdXMiPjxwYXRoIGQ9Ik0xMiAyMlYxMiIvPjxwYXRoIGQ9Ik0xNiAxN2g2Ii8+PHBhdGggZD0iTTE5IDE0djYiLz48cGF0aCBkPSJNMjEgMTAuNTM1VjhhMiAyIDAgMCAwLTEtMS43M2wtNy00YTIgMiAwIDAgMC0yIDBsLTcgNEEyIDIgMCAwIDAgMyA4djhhMiAyIDAgMCAwIDEgMS43MjlsNyA0YTIgMiAwIDAgMCAyIC4wMDFsMS42NzUtLjk1NSIvPjxwYXRoIGQ9Ik0zLjI5IDcgMTIgMTJsOC43MS01Ii8+PHBhdGggZD0ibTcuNSA0LjI3IDguOTk3IDUuMTQ4Ii8+PC9zdmc+" alt="" style="width: 30px; height: 30px; margin-left: 10px;"></h2>

    <p style="color: navy;">Please add the products first before adding product specifications</p>
    <form onsubmit="addProduct(event)" style="margin-top: 5px;">

       
        <input type="text" id="name" placeholder="Product Name" required>

        <select id="category">
            <option>Laptop</option>
            <option>Phone</option>
            <option>Computer</option>
        </select>

        <input type="number" id="price" placeholder="Price" required>
        <input type="number" id="stock" placeholder="Stock" required>

        <input type="file" id="image" accept="image/*">

         <button type="submit">Add Product</button>
        <!-- ATTRIBUTES -->
        <h3 style="color: gray;">Attributes</h3>
        <div id="kvContainer">
            <div class="kv-row">
                <input type="text" placeholder="Key" name="spec_key[]">
                <input type="text" placeholder="Value" name="spec_value[]">
                <button type="button" onclick="addRow()">+</button>
            </div>
        </div>

        <button type="submit">Add Specifications</button>
    </form>
</div>

<!-- DELETE -->
<div class="card">
    <h2 style="display: flex; color: gray;">Delete Product <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9ImN1cnJlbnRDb2xvciIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiIGNsYXNzPSJsdWNpZGUgbHVjaWRlLXRyYXNoLWljb24gbHVjaWRlLXRyYXNoIj48cGF0aCBkPSJNMTkgNnYxNGEyIDIgMCAwIDEtMiAySDdhMiAyIDAgMCAxLTItMlY2Ii8+PHBhdGggZD0iTTMgNmgxOCIvPjxwYXRoIGQ9Ik04IDZWNGEyIDIgMCAwIDEgMi0yaDRhMiAyIDAgMCAxIDIgMnYyIi8+PC9zdmc+" alt="" style="width: 30px; height: 30px; margin-left: 10px;"></h2>
    <input type="text" id="deleteId" placeholder="Enter ID">
    <button onclick="deleteProduct()">Delete</button>

    <div style="background-color: white;">
    <h2 style="color: gray; display: flex;">Update Stock <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9ImN1cnJlbnRDb2xvciIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiIGNsYXNzPSJsdWNpZGUgbHVjaWRlLXJlZnJlc2gtY2N3LWljb24gbHVjaWRlLXJlZnJlc2gtY2N3Ij48cGF0aCBkPSJNMjEgMTJhOSA5IDAgMCAwLTktOSA5Ljc1IDkuNzUgMCAwIDAtNi43NCAyLjc0TDMgOCIvPjxwYXRoIGQ9Ik0zIDN2NWg1Ii8+PHBhdGggZD0iTTMgMTJhOSA5IDAgMCAwIDkgOSA5Ljc1IDkuNzUgMCAwIDAgNi43NC0yLjc0TDIxIDE2Ii8+PHBhdGggZD0iTTE2IDE2aDV2NSIvPjwvc3ZnPg==" alt="" style="width: 30px; height: 30px; margin-left: 10px;"></h2>
    <input type="text" id="updateId" placeholder="Enter ID">
    <input type="number" id="updateStock" placeholder="Enter new stock">
    <button onclick="updateStock()">Update</button>
</div>
    
</div>




</div>



<!-- SEARCH -->
<input type="text" id="search" placeholder="Search by name..." onkeyup="searchProduct()">

<!-- TABLE -->
<table id="productTable">
    <thead>
        <tr>
            <th>Preview</th>
            <th>ID</th>
            <th>Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

</div>


<script>
    function addRow() {
    const container = document.getElementById("kvContainer");

    const div = document.createElement("div");
    div.className = "kv-row";

    div.innerHTML = `
        <input type="text" placeholder="Key" name = "spec_key[]">
        <input type="text" placeholder="Value" name = "spec_value[]">
        <button type="button" class="remove" onclick="this.parentElement.remove()">X</button>
    `;

    container.appendChild(div);
}
</script>



</body>
</html>
